const labels={waiting:'待处理',recorded:'已保存',accepted:'引擎已接收',completed:'后续已完成',blocked:'提交被拦截',expired:'已失效'};

const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function content(s){return escape(s).replace(/&lt;font color=&#39;grey&#39;&gt;([\s\S]*?)&lt;\/font&gt;/g,'$1').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}
function render(e){if(e.tag==='form')return '<div class="form-preview">'+e.elements.map(render).join('')+'</div>';if(e.tag==='input')return '<label class="form-field">'+escape(e.label.content)+'<textarea maxlength="'+e.max_length+'" rows="3" placeholder="在这里填写真实意见；本页仅预览"></textarea></label>';if(e.tag==='markdown')return '<div class="md '+(e.text_size==='notation'?'caption':'')+'">'+content(e.content)+'</div>';if(e.tag==='column_set')return '<div class="columns">'+e.columns.map(render).join('')+'</div>';if(e.tag==='column'){let bg=e.background_style||'default';return '<div class="column '+(e.padding?'block':'')+'" style="background:'+(bg==='default'?'transparent':(bg==='grey-50'?'#f5f6f8':colors[bg.split('-')[0]][0]))+'">'+e.elements.map(render).join('')+'</div>'}if(e.tag==='button')return '<button class="button '+e.type+'" data-phase="recorded">'+escape(e.text.content)+'</button>';return ''}
function show(key){let c=cards[key],h=c.header;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));document.getElementById('card').innerHTML='<div class="header" style="--bg:'+colors[h.template][0]+';--color:'+colors[h.template][1]+'"><div class="title-row"><span class="icon">✓</span><span class="title">'+escape(h.title.content)+'</span><span class="badge">'+h.text_tag_list[0].text.content+'</span></div><div class="subtitle">'+escape(h.subtitle.content)+'</div></div><div class="body">'+c.body.elements.map(render).join('')+'</div>';document.getElementById('json').textContent=JSON.stringify(c,null,2)}
