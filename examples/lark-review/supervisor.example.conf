; Replace absolute paths and profile. Install/configure supervisor separately.
[program:agentflow-lark]
directory=/absolute/path/to/workspace
command=/usr/bin/python3 executors/programs/lark/lark_adapter.py --workspace . --profile bot-connect --agentflow /absolute/path/to/agentflow
user=YOUR_LOCAL_USER
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/absolute/path/to/workspace/executors/programs/lark/service.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
