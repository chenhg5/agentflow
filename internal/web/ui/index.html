        .toolbar { align-items: flex-start; flex-wrap: wrap; }

      const formatTime = (value, language) => value ? new Date(value).toLocaleString(languageTags[language] || languageTags.en) : "";
      const readPreference = (key, fallback) => {
        try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; }
      };
      function initialLanguage() {
        const saved = readPreference("agentflow-language", "");
        if (Object.hasOwn(languageTags, saved)) return saved;
        for (const value of [...(navigator.languages || []), navigator.language || ""]) {
          const tag = value.toLowerCase();
          if (tag === "zh" || tag.startsWith("zh-")) return /(?:^|-)(?:hant|tw|hk|mo)(?:-|$)/.test(tag) ? "zh-TW" : "zh-CN";
          if (tag === "en" || tag.startsWith("en-")) return "en";
        }
        return "en";
      }

      function nodeLayout(workflow, state, description, language, theme, selectedNodeID) {
        const graphEdges = description?.edges || [];
        const definitions = [...(workflow?.nodes || [])];
        if (graphEdges.some((edge) => edge.target === "$end")) definitions.push({ id: "$end", executor: "end" });
        const levels = new Map();
        const levelOf = (id, trail = new Set()) => {
          if (levels.has(id)) return levels.get(id);
          if (trail.has(id)) return 0;
          const incoming = graphEdges.filter((edge) => edge.target === id && !edge.maxIterations);
          if (id === workflow?.entry || incoming.length === 0) {
            levels.set(id, 0);
            return 0;
          }
          const nextTrail = new Set(trail);
          nextTrail.add(id);
          const level = Math.max(...incoming.map((edge) => levelOf(edge.source, nextTrail))) + 1;
          levels.set(id, level);
          return level;
        };
        definitions.forEach((node) => levelOf(node.id));
        const rows = new Map();
        const palette = themePalettes[theme] || themePalettes.dark;
        return {
          nodes: definitions.map((definition) => {
            const nodeState = definition.id === "$end" ? { status: state?.status === "succeeded" ? "succeeded" : "pending" } : (state?.nodes?.[definition.id] || {});
            const level = levels.get(definition.id) || 0;
            const row = rows.get(level) || 0;
            rows.set(level, row + 1);
            const status = nodeState.status || "pending";
            return {
              id: definition.id,
              type: "default",
              selected: definition.id === selectedNodeID,
              position: { x: level * 280 + 50, y: row * 150 + 50 },
              sourcePosition: Position.Right,
              targetPosition: Position.Left,
              data: { label: h(NodeCard, { definition, state: nodeState, status, language }), definition, state: nodeState },
            };
          }),
          edges: graphEdges.map((edge) => {
            const channels = edge.channels || ["control"];

            const hasCondition = channels.includes("condition");
            const isParallel = channels.includes("parallel");
            return {
              id: edge.id,
              source: edge.source,
              target: edge.target,
              animated: (state?.nodes?.[edge.target]?.status === "running"),
              label: hasCondition ? edge.condition : (isParallel ? "⇉" : (edge.maxIterations ? t(language, "loopMax", { value: edge.maxIterations }) : undefined)),
              labelStyle: { fill: hasCondition ? palette.condition : palette.label, fontSize: 10 },
              labelBgStyle: { fill: palette.labelBackground, fillOpacity: 1 },
              markerEnd: { type: MarkerType.ArrowClosed },
              style: { stroke: hasCondition ? palette.condition : (isParallel ? palette.label : palette.edge), strokeWidth: isParallel ? 2 : 1.5, strokeDasharray: hasCondition ? "5 4" : undefined },
            };
          }),
        };
      }

      function NodeCard({ definition, state, status, language }) {
		const candidates = definition.execution?.candidates?.map((candidate) => candidate.executor) || [];
		const executorLabel = state?.selectedExecutor || candidates.join(" → ") || (definition.id === "$end" ? t(language, "end") : "—");
        const elapsed = state?.startedAt ? Math.max(0, (state.finishedAt ? Date.parse(state.finishedAt) : Date.now()) - Date.parse(state.startedAt)) : state?.durationMs || 0;
        return h("div", { className: "node-card" },
          h("div", { className: "node-head" },
            h("i", { className: "node-dot " + statusClass(status) }),
            h("span", { className: "node-name", title: definition.id }, definition.id),
          ),
          h("div", { className: "node-type" }, executorLabel + " · " + statusLabel(language, status) + (definition.dispatch === "all" ? " · " + t(language, "fanOut") : "") + (definition.join ? " · " + t(language, "join") : "")),
          state && (state.durationMs || state.attempts || state.outputBytes) ? h("div", { className: "node-stats" },
            h("span", null, formatMs(Number.isFinite(elapsed) ? elapsed : 0)),
            h("span", null, t(language, "attemptsValue", { value: state.attempts || 0 })),
            h("span", null, formatBytes(state.outputBytes || 0)),
          ) : null,
        );
      }

      function Flow({ workflow, state, description, language, theme, selectedNodeID, onSelect }) {
        const graph = useMemo(() => nodeLayout(workflow, state, description, language, theme, selectedNodeID), [workflow, state, description, language, theme, selectedNodeID]);
        const palette = themePalettes[theme] || themePalettes.dark;
        return h("div", { className: "flow" },
          h(ReactFlow, { nodes: graph.nodes, edges: graph.edges, fitView: true, minZoom: 0.2, maxZoom: 1.8, attributionPosition: "bottom-left", onNodeClick: (_event, node) => onSelect(node.data.definition), onPaneClick: () => onSelect(null) },
            h(Background, { color: palette.grid, gap: 24, size: 1 }),
            h(Controls, null),
            h(MiniMap, { nodeColor: (node) => {
              const value = node?.data?.state?.status || "pending";
              return value === "succeeded" ? "#238636" : value === "failed" ? "#f85149" : value === "running" ? "#1f6feb" : theme === "light" ? "#94a3b8" : "#8b949e";
            }}),
          ),
        );
      }

      function JsonBlock({ label, value }) {
        if (value === undefined || value === null || (typeof value === "object" && Object.keys(value).length === 0)) return null;
        return h("div", { className: "inspector-section" },
          h("div", { className: "inspector-label" }, label),
          h("pre", null, typeof value === "string" ? value : JSON.stringify(value, null, 2)),
        );
      }

      function RuntimeValue({ label, record, placeholder, language }) {
        const [copyState, setCopyState] = useState("copy");
        useEffect(() => { setCopyState("copy"); }, [record?.value]);
        const text = JSON.stringify(record?.value, null, 2);
        const copy = async () => {
          try { await navigator.clipboard.writeText(text); setCopyState("copied"); }
          catch (_) { setCopyState("copyFailed"); }
        };
        return h("section", { className: "runtime-value", "aria-label": label },
          h("div", { className: "runtime-value-head" }, h("span", null, label), record?.available ? h("button", { onClick: copy }, t(language, copyState)) : null),
          record?.available ? h("pre", null, text) : h("div", { className: "runtime-placeholder" }, record?.error || placeholder),
        );
      }

      function Inspector({ definition, state, description, language, runID, history = [], visits = {} }) {
        const [tab, setTab] = useState("data");
        const [visit, setVisit] = useState("current");
        const [loaded, setLoaded] = useState(null);
        const nodeID = definition?.id;
        const detailKey = JSON.stringify([runID, nodeID, visit]);
        useEffect(() => { setVisit("current"); setTab("data"); }, [runID, nodeID]);
        useEffect(() => {
          if (!runID || !nodeID || nodeID === "$end") return undefined;
          const controller = new AbortController();
          let busy = false;
          const loadDetails = async () => {
            if (busy) return;
            busy = true;
            try {
              const query = new URLSearchParams({ run: runID, node: nodeID, visit });
              const response = await fetch("/api/node?" + query, { signal: controller.signal });
              if (!response.ok) throw new Error("Node details unavailable");
              const data = await response.json();
              if (!controller.signal.aborted) setLoaded({ key: detailKey, data });
            } catch (_) {
              if (!controller.signal.aborted) setLoaded((previous) => ({ key: detailKey, data: previous?.key === detailKey ? previous.data : null, error: true }));
            } finally { busy = false; }
          };
          loadDetails();
          const timer = setInterval(loadDetails, 2000);
          return () => { controller.abort(); clearInterval(timer); };
        }, [runID, nodeID, visit]);
        if (!definition) return h("div", { className: "inspector" }, h("div", { className: "inspector-empty" }, t(language, "selectNode")));
        const previous = history.filter((item) => item.nodeId === nodeID && item.visit !== visits[nodeID]);
        const selectedState = visit === "current" ? state : history.find((item) => item.nodeId === nodeID && String(item.visit) === visit)?.state;
        const currentDetails = loaded?.key === detailKey ? loaded : null;
        const detail = visit === "current" && visits[nodeID] && currentDetails?.data?.visit !== visits[nodeID] ? null : currentDetails?.data;
        const runtime = detail?.state || selectedState;
        const hasRun = Boolean(runID && runtime && nodeID !== "$end");
        const recorded = (key) => ({ available: runtime && Object.hasOwn(runtime, key), value: runtime?.[key] });
        const input = detail?.input || recorded("input");
        const output = detail?.output || recorded("result");
        const pending = !runtime || runtime.status === "pending" || runtime.status === "skipped";
        const waiting = runtime?.status === "running" || runtime?.status === "waiting_input";
        const edges = (description?.edges || []).filter((edge) => edge.source === nodeID || edge.target === nodeID);
        const candidates = definition.execution?.candidates;
        const executorLabel = runtime?.selectedExecutor || candidates?.map((candidate) => candidate.executor).join(" → ") || "";
        return h("div", { className: "inspector" },
          h("div", { className: "inspector-head" }, h("strong", null, nodeID), h("span", null, executorLabel + (runtime?.status ? " · " + statusLabel(language, runtime.status) : "")),
            previous.length ? h("select", { value: visit, "aria-label": t(language, "visitLabel"), onChange: (event) => setVisit(event.target.value) },
              h("option", { value: "current" }, t(language, "currentVisit") + " · " + t(language, "visit", { value: visits[nodeID] || 1 })),
              previous.map((item) => h("option", { key: item.visit, value: String(item.visit) }, t(language, "visit", { value: item.visit }) + " · " + statusLabel(language, item.state.status))),
            ) : null,
          ),
          hasRun ? h("div", { className: "inspector-tabs", role: "tablist" },
            [["data", "dataTab"], ["logs", "logsTab"], ["definition", "definitionTab"]].map(([id, label]) => h("button", { key: id, role: "tab", "aria-selected": tab === id, className: tab === id ? "active" : "", onClick: () => setTab(id) }, t(language, label))),
          ) : null,
          currentDetails?.error ? h("div", { className: "log-note" }, t(language, "detailFailed")) : null,
          hasRun && tab === "data" ? h(React.Fragment, null,
            runtime.error ? h("div", { className: "runtime-error" }, runtime.error) : null,
            h("div", { className: "runtime-grid" },
              h(RuntimeValue, { label: t(language, "runtimeInput"), record: input, placeholder: t(language, pending ? "notStarted" : "noInput"), language }),
              h(RuntimeValue, { label: t(language, "runtimeResult"), record: output, placeholder: t(language, pending ? "notStarted" : waiting ? "outputPending" : "noOutput"), language }),
            ),
          ) : null,
          hasRun && tab === "logs" ? h(React.Fragment, null,
            h("div", { className: "session-meta" }, executorLabel ? h("span", null, t(language, "selectedExecutor") + ": ", h("code", null, executorLabel)) : null, runtime.sessionId ? h("span", null, "Session ID: ", h("code", null, runtime.sessionId)) : null),
            h("p", { className: "log-note" }, t(language, "logsScope")),
            ["stdout", "stderr"].map((channel) => {
              const log = detail?.logs?.[channel];
              return h("section", { className: "execution-log", key: channel },
                h("div", { className: "inspector-label" }, channel),
                log?.available ? h("pre", null, log.text || t(language, "emptyLog")) : h("div", { className: "log-note" }, log?.error || t(language, "noLogs")),
                log?.truncated ? h("div", { className: "log-note" }, t(language, "logTail")) : null,
              );
            }),
            h(JsonBlock, { label: t(language, "attemptSequence"), value: runtime.attemptSequence }),
          ) : null,
          !hasRun || tab === "definition" ? h(React.Fragment, null,
            h("div", { className: "inspector-grid" },
              h(JsonBlock, { label: t(language, "inputSchema"), value: definition.inputSchema }),
              h(JsonBlock, { label: t(language, "outputSchema"), value: definition.outputSchema }),
              h(JsonBlock, { label: t(language, "candidates"), value: candidates }),
              h(JsonBlock, { label: t(language, "fallbackPolicy"), value: definition.execution?.fallback }),
              h(JsonBlock, { label: t(language, "join"), value: definition.join }),
              h(JsonBlock, { label: t(language, "failure"), value: runtime?.failure }),
              h(JsonBlock, { label: t(language, "artifacts"), value: runtime?.artifacts }),
            ),
            edges.length ? h("div", { className: "graph-warning" }, t(language, "edges") + ": ", edges.map((edge) => h("span", { className: "edge-chip", key: edge.id, title: edge.map ? JSON.stringify(edge.map, null, 2) : undefined }, edge.source + " → " + edge.target + (edge.condition ? " · " + edge.condition : "") + (edge.map ? " · map" : "") + (edge.maxIterations ? " · max " + edge.maxIterations : "")))) : null,
          ) : null,
        );
      }

      function Metric({ label, value }) {
        return h("div", { className: "metric" }, h("div", { className: "metric-label" }, label), h("div", { className: "metric-value" }, value));
      }

      function Comparison({ comparison, language }) {
        if (!comparison) return null;
        const runtime = comparison.runtime || {};
        const rows = [...Object.entries(runtime), ...Object.entries(comparison.measurements || {})];
        const label = (key) => key.replaceAll("_", " ");
        const value = (metric) => {
          const percent = metric.change_percent === undefined ? "" : ` (${metric.change_percent >= 0 ? "+" : ""}${metric.change_percent.toFixed(1)}%)`;
          const state = metric.delta === 0 ? " · " + t(language, "unchanged") : metric.improved === undefined ? "" : metric.improved ? " · " + t(language, "improved") : " · " + t(language, "regressed");
          return `${metric.delta >= 0 ? "+" : ""}${metric.delta}${percent}${state}`;
        };
        return h("div", { className: "comparison" },
          h("div", { className: "comparison-title" }, t(language, "comparison") + " · " + (comparison.baseline?.run_id || "") + (comparison.same_version ? "" : " · Δ version")),
          h("div", { className: "comparison-grid" }, rows.map(([name, metric]) => h(Metric, { key: name, label: label(name), value: value(metric) }))),
        );
      }

      function Summary({ view, language }) {
        if (view.mode !== "run") return null;
        const run = view.run;
        const snapshot = run.metrics || {};
        return h("div", { className: "summary" },
          h(Metric, { label: t(language, "status"), value: statusLabel(language, run.status) }),
          h(Metric, { label: t(language, "duration"), value: formatMs(snapshot.duration_ms) }),
          h(Metric, { label: t(language, "attempts"), value: snapshot.totals?.attempts || 0 }),
          h(Metric, { label: t(language, "input"), value: formatBytes(snapshot.totals?.input_bytes || 0) }),
          h(Metric, { label: t(language, "output"), value: formatBytes(snapshot.totals?.output_bytes || 0) }),
          h(Metric, { label: t(language, "logs"), value: formatBytes((snapshot.totals?.stdout_bytes || 0) + (snapshot.totals?.stderr_bytes || 0)) }),
          h("div", { className: "legend" },
            ["succeeded", "running", "waiting_input", "failed", "pending"].map((status) => h("span", { key: status }, h("i", { className: statusClass(status) }), statusLabel(language, status))),
          ),
        );
      }

      function Sidebar({ view, language }) {
        const runs = view.mode === "dashboard" ? view.runs : view.runs || [];
        return h("aside", { className: "sidebar" },
          h("div", { className: "brand" }, h("h1", null, "AgentFlow"), h("p", null, t(language, "visualization"))),
          h("div", { className: "side-section" }, t(language, "recentRuns")),
          h("div", { className: "run-list" }, runs.length ? runs.map((run) => h("a", { className: "run-item" + (view.run?.run_id === run.run_id ? " active" : ""), href: "?run=" + encodeURIComponent(run.run_id), key: run.run_id },
            h("div", { className: "run-name" }, run.workflow),
            h("div", { className: "run-meta" }, h("span", null, statusLabel(language, run.status)), h("span", null, formatTime(run.updated_at, language))),
          )) : h("div", { className: "empty" }, t(language, "noRuns"))),
        );
      }

      function ViewControls({ language, setLanguage, theme, setTheme, onRefresh }) {
        return h("div", { className: "toolbar-actions" },
          h("label", { className: "select-wrap" }, h("span", { className: "sr-only" }, t(language, "language")), h("select", { className: "language-select", value: language, onChange: (event) => setLanguage(event.target.value), "aria-label": t(language, "language") }, languageOptions.map((option) => h("option", { value: option.value, key: option.value }, option.label)))),
          h("button", { onClick: () => setTheme(theme === "dark" ? "light" : "dark"), "aria-label": theme === "dark" ? t(language, "switchToLight") : t(language, "switchToDark"), title: theme === "dark" ? t(language, "switchToLight") : t(language, "switchToDark") }, (theme === "dark" ? "☀ " + t(language, "light") : "☾ " + t(language, "dark"))),
          h("button", { onClick: onRefresh }, t(language, "refresh")),
        );
      }

      function ResizeHandle({ height, setHeight, language }) {
        const [dragging, setDragging] = useState(false);
        const start = useRef(null);
        const clamp = (value) => {
          const viewport = document.documentElement.clientHeight || window.innerHeight || 900;
          return Math.round(Math.max(160, Math.min(viewport - 160, value)));
        };
        useEffect(() => {
          if (!dragging) return undefined;
          const move = (event) => {
            if (!start.current) return;
            setHeight(clamp(start.current.height + start.current.y - event.clientY));
          };
          const stop = () => { setDragging(false); start.current = null; document.body.classList.remove("resizing"); };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", stop, { once: true });
          return () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", stop); };
        }, [dragging]);
        const begin = (event) => {
          event.preventDefault();
          start.current = { y: event.clientY, height };
          setDragging(true);
          document.body.classList.add("resizing");
        };
        const onKeyDown = (event) => {
          const step = 32;
          if (event.key === "ArrowUp") { event.preventDefault(); setHeight(clamp(height + step)); }
          if (event.key === "ArrowDown") { event.preventDefault(); setHeight(clamp(height - step)); }
          if (event.key === "Home") { event.preventDefault(); setHeight(clamp(160)); }
          if (event.key === "End") { event.preventDefault(); setHeight(clamp((document.documentElement.clientHeight || window.innerHeight || 900) - 160)); }
        };
        return h("div", { className: "resize-handle" + (dragging ? " dragging" : ""), role: "separator", "aria-orientation": "horizontal", "aria-label": t(language, "resizeInspector"), "aria-valuenow": height, tabIndex: 0, title: t(language, "resizeInspector"), onPointerDown: begin, onKeyDown, onDoubleClick: () => setHeight(280) });
      }

      function App() {
        const [view, setView] = useState(null);
        const [selectedNode, setSelectedNode] = useState(null);
        const [error, setError] = useState("");
        const [language, setLanguage] = useState(initialLanguage);
        const [theme, setTheme] = useState(() => readPreference("agentflow-theme", "dark"));
        const [lowerPanelHeight, setLowerPanelHeight] = useState(() => Number(readPreference("agentflow-lower-panel-height", "280")) || 280);
        useEffect(() => {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          try { localStorage.setItem("agentflow-theme", theme); } catch (_) {}
        }, [theme]);
        useEffect(() => {
          document.documentElement.lang = languageTags[language] || languageTags.en;
          try { localStorage.setItem("agentflow-language", language); } catch (_) {}
        }, [language]);
        useEffect(() => {
          try { localStorage.setItem("agentflow-lower-panel-height", String(lowerPanelHeight)); } catch (_) {}
        }, [lowerPanelHeight]);
        const load = async () => {
          try {
            const response = await fetch(window.location.search ? "/api/state" + window.location.search : "/api/state");
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "request failed");
            setView(data);
            setSelectedNode((current) => current ? (data.workflow?.nodes || []).find((node) => node.id === current.id) || null : null);
            setError("");
          } catch (err) {
            setError(err.message);
          }
        };
        useEffect(() => {
          load();
          const timer = setInterval(load, 2000);
          return () => clearInterval(timer);
        }, []);
        if (error) return h("div", { className: "error" }, t(language, "unable", { error }));
        if (!view) return h("div", { className: "loading" }, t(language, "loading"));
        if (view.mode === "dashboard") return h("div", { className: "shell" },
          h(Sidebar, { view, language }),
          h("main", { className: "main" },
            h("div", { className: "toolbar" }, h("div", { className: "title" }, h("h2", null, "AgentFlow"), h("p", null, t(language, "selectRun"))), h(ViewControls, { language, setLanguage, theme, setTheme, onRefresh: load })),
            h("div", { className: "content" }, h("div", { className: "empty" }, t(language, "chooseRun"))),
          ),
        );
        const state = view.mode === "run" ? view.run.state : null;
        return h("div", { className: "shell" },
          h(Sidebar, { view, language }),
          h("main", { className: "main" },
            h("div", { className: "toolbar" },
              h("div", { className: "title" },
                h("h2", null, view.workflow.name),
                h("p", null, view.mode === "run" ? view.run.run_id + " · " + t(language, "updated") + " " + formatTime(state.updatedAt, language) : view.source),
              ),
              h(ViewControls, { language, setLanguage, theme, setTheme, onRefresh: load }),
            ),
            h("div", { className: "content" },
              h(Flow, { workflow: view.workflow, state, description: view.graph, language, theme, selectedNodeID: selectedNode?.id, onSelect: setSelectedNode }),
              h(ResizeHandle, { height: lowerPanelHeight, setHeight: setLowerPanelHeight, language }),
              h("div", { className: "lower-panel", style: { height: lowerPanelHeight + "px" } },
                !selectedNode ? h(Summary, { view, language }) : null,
                !selectedNode ? h(Comparison, { comparison: view.comparison, language }) : null,
                h(Inspector, { key: (view.run?.run_id || "workflow") + ":" + (selectedNode?.id || ""), definition: selectedNode, state: selectedNode && state?.nodes?.[selectedNode.id], description: view.graph, language, runID: view.run?.run_id, history: state?.history, visits: state?.visits }),
              ),
            ),
          ),
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
